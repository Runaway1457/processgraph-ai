name: quality-gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm smoke
      - name: Verify deterministic evidence artifact
        run: |
          node --import tsx scripts/generate-proof.ts --output .artifacts/proof-a.json
          node --import tsx scripts/generate-proof.ts --output .artifacts/proof-b.json
          cmp .artifacts/proof-a.json .artifacts/proof-b.json
      - name: Production dependency audit
        if: matrix.node == 22
        run: pnpm audit --prod --audit-level high
      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: processgraph-proof
          path: .artifacts/proof-a.json
          if-no-files-found: error
          retention-days: 14
