services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: processgraph
      POSTGRES_USER: processgraph
      POSTGRES_PASSWORD: processgraph-local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U processgraph -d processgraph"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - processgraph-data:/var/lib/postgresql/data

volumes:
  processgraph-data:
